name: Android Gradle Build

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "scenes/**"
      - "scripts/**"
      - ".github/workflows/android-gradle.yml"

jobs:
  android:
    name: Export Android APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install matching Godot Android export templates
        run: |
          set -eu
          TEMPLATE_VERSION="4.3.stable"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          curl -fL "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION"
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION/"
          test -f "$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION/android_debug.apk"
          test -f "$HOME/.local/share/godot/export_templates/$TEMPLATE_VERSION/android_release.apk"

      - name: Validate Godot project
        run: godot --headless --editor --path . --quit

      - name: Build Android APK with Gradle
        run: |
          mkdir -p build
          godot --headless --path . --verbose --export-debug "Android" build/KingdomOfAshes-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: KingdomOfAshes-Android-debug
          path: build/KingdomOfAshes-debug.apk
          if-no-files-found: error
          retention-days: 14
